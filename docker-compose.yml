# Optional local services (the app also runs with embedded PGlite and in-memory rate limits).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: examdle
      POSTGRES_PASSWORD: examdle
      POSTGRES_DB: examdle
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
volumes:
  pgdata: {}
# Then: DATABASE_URL=postgres://examdle:examdle@localhost:5432/examdle npm run db:migrate && npm run db:seed
